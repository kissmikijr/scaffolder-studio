name: pull-request

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn tsc

      - name: Build
        run: yarn build:all

      - name: Unit Tests
        run: yarn test --coverage=false --passWithNoTests

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build:all

      - name: Install Playwright OS dependencies
        run: yarn playwright install-deps chromium

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Prepare Playwright auth cache dir
        run: mkdir -p node_modules/.cache/e2e-auth

      - name: Start backend
        run: yarn start-backend &
        env:
          NODE_ENV: development
          NODE_OPTIONS: --no-node-snapshot
          APP_CONFIG_app_baseUrl: http://localhost:7008
          APP_CONFIG_backend_baseUrl: http://localhost:7008
          APP_CONFIG_backend_cors_origin: http://localhost:7008
          APP_CONFIG_backend_database_connection_port: '5432'

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to start..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:7008/api/catalog/entities > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i/60 - waiting..."
            sleep 2
          done

      - name: Run E2E tests
        run: yarn test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_URL: http://localhost:7008

      - name: Upload E2E test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: e2e-test-report/
          retention-days: 14

      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: node_modules/.cache/e2e-test-results/
          retention-days: 14
