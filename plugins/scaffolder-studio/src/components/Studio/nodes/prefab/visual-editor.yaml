apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  annotations:
    backstage.io/managed-by-location: visual:scaffolder-studio
    backstage.io/managed-by-origin-location: visual:scaffolder-studio
  name: add-tenant-to-alerts
  description: Adds the new customer to the PagerDuty
spec:
  owner: group:default/engineering
  type: service
  parameters:
    - title: Provide some simple information
      required: []
      properties:
        tenant_name:
          type: string
          description: Must be tenant slug
          title: Name
  steps:
    - id: fetch-alerts-file
      name: Fetch alerts file
      action: fetch:plain
      input:
        url: >-
          "https://github.com/roadiehq/roadie-demo-infra/tree/main/terraform/tenant-alerting/"
        targetPath: fetch-folder
    - id: fs-rename
      name: fs-rename
      action: fs:rename
      input:
        files:
          - from: fetch-folder/alertable_tenants.json
            to: ./alerts-folder/alertable_tenants.json
    - id: parse-alerts
      name: Parse retrieved alerts file
      action: roadiehq:utils:fs:parse
      input:
        path: ./alerts-folder/alertable_tenants.json
    - id: debug-log
      name: debug-log
      action: debug:log
      input:
        message: Alerts content ${{ steps['parse-alerts'].output['content'] }}
    - id: add-tenant-to-list
      name: Add tenant
      action: roadiehq:utils:jsonata:json:transform
      input:
        replacer: []
        as: string
        path: ./alerts-folder/alertable_tenants.json
        expression: $.tenant_slugs ~> $append("${{parameters.tenant_name}}") ~> $sort()
        space: ''
    - id: write-alerts-to-file
      name: Overwrite the existing alerts file with new contents
      action: roadiehq:utils:fs:write
      input:
        path: ./alerts-folder/alertable_tenants.json
        content: '{ "tenant_slugs": ${{ steps[''add-tenant-to-list''].output[''result''] }}}'
    - id: parse-alerts
      name: Parse modified Alerts file
      action: roadiehq:utils:fs:parse
      input:
        path: ./alerts-folder/alertable_tenants.json
    - id: log-result
      name: Display modified alerts file
      action: debug:log
      input:
        message: >-
          alertable_tenant.json content: ${{
          steps['parse-alerts'].output['content'] }}
    - id: createPullRequest
      name: Create a pull request
      action: publish:github:pull-request
      input:
        filesToDelete: []
        reviewers: []
        assignees: []
        teamReviewers: []
        repoUrl: github.com?repo=roadie-demo-infra&owner=roadiehq
        branchName: add-tenant-${{ parameters.tenant_name }}-${{ '' | now}}
        sourcePath: ./alerts-folder/
        targetPath: ./terraform/tenant-alerting/
        title: A tenant ${{ parameters.tenant_name }} to alerts tenant list
        description: >-
          This PR updates the alertable_tenants.json file with the ${{
          parameters.tenant_name }} tenant slug
